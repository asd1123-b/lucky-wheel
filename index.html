<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>母親節特別企劃</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
      :root {
        --pink-light: #ffc0cb;
        --pink-main: #ffb6c1;
        --pink-deep: #ff5f8f;
        --pink-red: #ff6f86;
        --pink-soft: #ffe4e8;
        --yellow-soft: #fff0a8;
        --blue-soft: #add8e6;
        --white: #ffffff;
        --text-color: #7a4d58;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        padding: 32px 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.55) 0 10%, transparent 22%),
          radial-gradient(circle at 82% 12%, rgba(255, 240, 168, 0.52) 0 8%, transparent 22%),
          linear-gradient(145deg, #ffb6c1 0%, #ffd0d8 48%, #ffe7ec 100%);
        font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        overflow: hidden;
        position: relative;
      }

      body::before,
      body::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
      }

      body::before {
        width: 260px;
        height: 260px;
        left: -96px;
        bottom: -88px;
        background: rgba(255, 255, 255, 0.24);
      }

      body::after {
        width: 220px;
        height: 220px;
        right: -82px;
        top: 18%;
        background: rgba(173, 216, 230, 0.22);
      }

      /* 動態背景飄浮心形 */
      .bg-elements {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .floating-heart {
        --heart-color: var(--pink-light);
        --heart-outline: rgba(255, 255, 255, 0.84);
        position: absolute;
        bottom: -68px;
        width: 1em;
        height: 1em;
        color: var(--heart-color);
        opacity: 0;
        animation: floatUp 10s linear infinite;
        filter:
          drop-shadow(1px 0 0 var(--heart-outline))
          drop-shadow(-1px 0 0 var(--heart-outline))
          drop-shadow(0 1px 0 var(--heart-outline))
          drop-shadow(0 -1px 0 var(--heart-outline))
          drop-shadow(0 7px 12px rgba(255, 105, 140, 0.18));
        user-select: none;
      }

      .floating-heart::before {
        content: "♡";
        display: block;
        color: var(--heart-color);
        font-weight: 900;
        line-height: 1;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.72);
      }

      @keyframes floatUp {
        0% {
          transform: translate3d(0, 0, 0) rotate(-12deg) scale(0.86);
          opacity: 0;
        }
        12% {
          opacity: 0.78;
        }
        50% {
          transform: translate3d(var(--drift), -58vh, 0) rotate(14deg) scale(1);
        }
        88% {
          opacity: 0.7;
        }
        100% {
          transform: translate3d(calc(var(--drift) * -0.55), -122vh, 0) rotate(32deg) scale(1.08);
          opacity: 0;
        }
      }

      /* 轉盤容器 */
      .wheel-container {
        position: relative;
        z-index: 10;
        width: min(78vw, 360px);
        height: min(78vw, 360px);
        border-radius: 50%;
        background: linear-gradient(145deg, #fff8fb 0%, #ffd4df 48%, #ff8eaa 100%);
        padding: 16px;
        box-shadow:
          0 28px 0 #ec6f8e,
          0 34px 0 rgba(176, 60, 88, 0.28),
          0 42px 38px rgba(133, 35, 66, 0.25),
          0 8px 24px rgba(255, 255, 255, 0.74) inset,
          0 -12px 20px rgba(225, 73, 115, 0.22) inset,
          0 0 0 8px #ff7ca0,
          0 0 0 15px rgba(255, 255, 255, 0.78),
          0 0 0 19px #ff8fac;
      }

      .wheel-container::before {
        content: "";
        position: absolute;
        inset: 14px;
        border-radius: 50%;
        z-index: 1;
        pointer-events: none;
        box-shadow:
          0 5px 12px rgba(255, 255, 255, 0.85) inset,
          0 -9px 16px rgba(187, 78, 108, 0.28) inset,
          0 0 0 7px rgba(255, 255, 255, 0.7) inset,
          0 0 0 11px rgba(255, 129, 164, 0.95) inset;
      }

      #wheel-canvas {
        position: relative;
        z-index: 0;
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 7px solid var(--white);
        background-color: var(--white);
        transition: transform 6.8s cubic-bezier(0.12, 0.72, 0.1, 1);
        box-shadow:
          0 0 0 4px #ff88a6,
          0 9px 18px rgba(165, 52, 84, 0.22) inset,
          0 -10px 20px rgba(255, 255, 255, 0.62) inset;
      }

      /* 指標 */
      .pointer {
        position: absolute;
        top: -36px;
        left: 50%;
        transform: translateX(-50%);
        width: 58px;
        height: 74px;
        z-index: 30;
        filter: drop-shadow(0 7px 8px rgba(122, 30, 54, 0.24));
      }

      .pointer::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        width: 46px;
        height: 46px;
        transform: translateX(-50%) rotate(45deg);
        border-radius: 50% 50% 50% 8px;
        background: linear-gradient(135deg, #ff8799 0%, #ff3d5d 72%);
        border: 4px solid #fff7fa;
        box-shadow:
          0 7px 0 #c7384e,
          0 9px 16px rgba(185, 41, 72, 0.28),
          inset 5px 5px 8px rgba(255, 255, 255, 0.35),
          inset -5px -6px 10px rgba(154, 28, 55, 0.18);
      }

      .pointer::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 17px;
        width: 14px;
        height: 14px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: #fff6f8;
        box-shadow:
          inset 0 2px 4px rgba(154, 28, 55, 0.2),
          0 1px 0 rgba(255, 255, 255, 0.75);
      }

      /* 中心 START 按鈕 */
      .start-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 92px;
        height: 92px;
        background: radial-gradient(circle at 30% 24%, #ffd7df 0 10%, #ff8aa3 30%, #ff4f78 72%);
        border-radius: 50%;
        border: 6px solid var(--white);
        color: var(--white);
        font-weight: 900;
        letter-spacing: 0.07em;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 40;
        box-shadow:
          0 12px 0 #d84c6d,
          0 19px 24px rgba(126, 34, 62, 0.28),
          0 0 0 5px rgba(255, 141, 169, 0.28),
          inset 0 6px 10px rgba(255, 255, 255, 0.42),
          inset 0 -8px 10px rgba(152, 30, 62, 0.18);
        text-shadow: 0 2px 2px rgba(140, 35, 65, 0.28);
        transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
        user-select: none;
      }

      .start-btn::after {
        content: "☝";
        position: absolute;
        right: -21px;
        bottom: -16px;
        color: #fff;
        font-size: 30px;
        text-shadow:
          0 2px 0 #ff6d8f,
          0 5px 8px rgba(116, 29, 58, 0.24);
        animation: tapHint 1.25s ease-in-out infinite;
      }

      @keyframes tapHint {
        0%, 100% {
          transform: translate(0, 0) rotate(-14deg);
        }
        50% {
          transform: translate(-5px, -5px) rotate(-22deg);
        }
      }

      .start-btn:active {
        transform: translate(-50%, calc(-50% + 8px)) scale(0.96);
        box-shadow:
          0 4px 0 #d84c6d,
          0 10px 16px rgba(126, 34, 62, 0.24),
          inset 0 4px 8px rgba(255, 255, 255, 0.34),
          inset 0 -6px 8px rgba(152, 30, 62, 0.18);
      }

      .start-btn.disabled {
        filter: grayscale(0.35) brightness(0.96);
        cursor: not-allowed;
        pointer-events: none;
      }

      /* 標題與裝飾 */
      .header {
        text-align: center;
        margin-bottom: 34px;
        z-index: 10;
      }

      .header h1 {
        color: #fff;
        margin: 0;
        font-size: clamp(26px, 7vw, 40px);
        line-height: 1.18;
        text-shadow:
          0 3px 0 #ff7d9e,
          0 8px 18px rgba(157, 43, 82, 0.22);
      }

      .header p {
        display: inline-block;
        color: var(--text-color);
        margin: 12px 0 0;
        padding: 7px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.58);
        box-shadow: 0 6px 16px rgba(255, 105, 140, 0.14);
        font-size: 14px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="bg-elements" id="bgElements"></div>

    <div class="header">
      <h1>✨ 秀香專屬特別企劃 ✨</h1>
      <p>點擊中心領取你的專屬禮物</p>
    </div>

    <div class="wheel-container">
      <div class="pointer" aria-hidden="true"></div>
      <canvas id="wheel-canvas" width="600" height="600"></canvas>
      <button id="spin-btn" class="start-btn" type="button" aria-label="開始抽獎">START</button>
    </div>

    <!-- 音效 (使用 Base64 或靜音佔位，此處保留邏輯) -->
    <audio id="spinAudio" preload="auto" autoplay loop playsinline>
      <source
        src="https://www.dropbox.com/scl/fi/qqv22denopmj1cgevvvlt/mysound_loop.mp3?rlkey=ti86j2jv29toy12lib8j4k592&st=ug8e5j5w&raw=1"
        type="audio/mpeg"
      />
    </audio>

    <script>
      const canvas = document.getElementById("wheel-canvas");
      const ctx = canvas.getContext("2d");
      const spinBtn = document.getElementById("spin-btn");
      const spinAudio = document.getElementById("spinAudio");
      const bgElements = document.getElementById("bgElements");

      const options = [
        "銘謝惠顧",
        "✨仙女配備",
        "顏值保固",
        "愛的抱抱",
        "小資確幸",
        "下集待續",
      ];

      const colors = [
        "#FF9FB2",
        "#FFFFFF",
        "#FF9FB2",
        "#FFFFFF",
        "#FF9FB2",
        "#FFFFFF",
      ];
      const heartColors = ["#FFC0CB", "#FFD700", "#ADD8E6"];
      const spinDuration = 6800;
      const targetIndex = 1; // 必中「仙女配備」的索引
      let currentRotation = 0;
      let isSpinning = false;

      function playBackgroundMusic() {
        spinAudio.volume = 0.55;
        spinAudio.loop = true;
        const playPromise = spinAudio.play();

        if (playPromise !== undefined) {
          playPromise.catch(() => {
            const unlockAudio = () => {
              spinAudio.play().catch(() => {});
              window.removeEventListener("touchstart", unlockAudio);
              window.removeEventListener("pointerdown", unlockAudio);
            };

            window.addEventListener("touchstart", unlockAudio, { once: true });
            window.addEventListener("pointerdown", unlockAudio, { once: true });
          });
        }
      }

      // 1. 初始化背景心形
      function createFloatingHearts() {
        // 清空舊有的避免重複生成
        bgElements.innerHTML = "";

        for (let i = 0; i < 42; i++) {
          const heart = document.createElement("div");
          heart.className = "floating-heart";

          const heartColor = heartColors[i % heartColors.length];
          heart.style.setProperty("--heart-color", heartColor);
          heart.style.setProperty("--drift", Math.random() * 110 - 55 + "px");

          // 隨機左右位置
          heart.style.left = Math.random() * 100 + "vw";

          // 隨機大小
          const size = Math.random() * 20 + 18;
          heart.style.fontSize = size + "px";

          // 隨機動畫延遲，讓愛心陸續出現
          heart.style.animationDelay = Math.random() * 8 + "s";

          // 隨機動畫速度 (7s ~ 12s)，增加錯落感
          heart.style.animationDuration = Math.random() * 5 + 7 + "s";

          bgElements.appendChild(heart);
        }
      }

      // 2. 繪製輪盤
      function drawWheel() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = canvas.width / 2 - 12;
        const sliceAngle = (2 * Math.PI) / options.length;
        const textRadius = radius * 0.72;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        options.forEach((text, i) => {
          const angle = i * sliceAngle - Math.PI / 2;
          const midAngle = angle + sliceAngle / 2;

          // 畫扇形
          ctx.beginPath();
          ctx.fillStyle = colors[i];
          ctx.moveTo(centerX, centerY);
          ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = "rgba(255, 255, 255, 0.86)";
          ctx.lineWidth = 5;
          ctx.stroke();

          // 畫文字：沿扇形中線旋轉，文字基準朝外並對齊圓心方向
          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.rotate(midAngle);
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = colors[i] === "#FFFFFF" ? "#FF4F78" : "#FFFFFF";
          ctx.font = "900 27px 'PingFang TC', 'Microsoft JhengHei', sans-serif";
          ctx.shadowColor = colors[i] === "#FFFFFF" ? "rgba(255, 182, 193, 0.38)" : "rgba(140, 35, 65, 0.22)";
          ctx.shadowBlur = 5;
          ctx.shadowOffsetY = 2;
          ctx.fillText(text, textRadius, 0);
          ctx.restore();
        });

        // 內外雙層圓框與立體高光
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.beginPath();
        ctx.arc(0, 0, radius - 6, 0, Math.PI * 2);
        ctx.lineWidth = 12;
        ctx.strokeStyle = "#FF79A0";
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, radius - 28, 0, Math.PI * 2);
        ctx.lineWidth = 9;
        const rimGradient = ctx.createLinearGradient(-radius, -radius, radius, radius);
        rimGradient.addColorStop(0, "rgba(255, 255, 255, 0.95)");
        rimGradient.addColorStop(0.52, "rgba(255, 182, 193, 0.35)");
        rimGradient.addColorStop(1, "rgba(200, 72, 108, 0.42)");
        ctx.strokeStyle = rimGradient;
        ctx.stroke();
        ctx.restore();
      }

      // 3. 抽獎邏輯 (必中仙女配備)
      function spin() {
        if (isSpinning) return;
        isSpinning = true;
        spinBtn.classList.add("disabled");

        // 確保 iOS 第一次互動後也能接續播放背景音樂
        playBackgroundMusic();

        const segmentDeg = 360 / options.length; // 60度
        const baseSpins = 9 * 360; // 旋轉 9 圈，搭配較長緩動更柔順

        /* 角度計算說明：
               Canvas 繪製起點已調整至 12 點鐘方向。
               順時針轉動 rotate(deg)。
               指標(Pointer)在 12 點鐘方向。
               目標索引 targetIndex = 1 (仙女配備)。
               停止公式：讓目標格的中心角度轉回 0 度上方。
            */
        const targetCenter = targetIndex * segmentDeg + segmentDeg / 2;
        const stopAngle = 360 - targetCenter;
        const rotationRemainder = ((currentRotation % 360) + 360) % 360;
        const alignmentAngle = (stopAngle - rotationRemainder + 360) % 360;

        // 累加旋轉角度 (確保每次旋轉都是順時針且連續)
        currentRotation += baseSpins + alignmentAngle;

        canvas.style.transform = `rotate(${currentRotation}deg)`;

        // 結束處理
        setTimeout(() => {
          isSpinning = false;
          spinBtn.classList.remove("disabled");

          // 灑花特效
          confetti({
            particleCount: 160,
            spread: 76,
            origin: { y: 0.6 },
            colors: ["#FFC0CB", "#FFD700", "#ADD8E6", "#FF5F8F", "#FFFFFF"],
          });

          alert("恭喜獲得：仙女配備兌換券！");
        }, spinDuration);
      }

      // 初始化
      createFloatingHearts();
      drawWheel();
      playBackgroundMusic();
      window.addEventListener("pageshow", playBackgroundMusic);
      spinBtn.addEventListener("click", spin);
    </script>
  </body>
</html>
