<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>母親節特別企劃</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
      :root {
        --pink-light: #ffc0cb;
        --pink-deep: #ff69b4;
        --pink-soft: #ffe4e1;
        --white: #ffffff;
        --text-color: #5d5d5d;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #fff5f6 0%, #ffe4e8 100%);
        font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
        overflow: hidden;
        position: relative;
      }

      /* 動態背景飄浮心形 */
      .bg-elements {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }

      .floating-heart {
        position: absolute;
        color: var(--pink-light);
        opacity: 0.6;
        animation: floatUp 10s linear infinite;
        filter: drop-shadow(0 0 5px rgba(255, 192, 203, 0.5));
      }

      @keyframes floatUp {
        0% {
          transform: translateY(110vh) rotate(0deg) translateX(0);
          opacity: 0;
        }
        10% {
          opacity: 0.6;
        }
        90% {
          opacity: 0.6;
        }
        100% {
          transform: translateY(-20vh) rotate(360deg) translateX(50px);
          opacity: 0;
        }
      }

      /* 轉盤容器 */
      .wheel-container {
        position: relative;
        z-index: 10;
        width: 320px;
        height: 320px;
        filter: drop-shadow(0 10px 25px rgba(255, 105, 180, 0.3));
      }

      #wheel-canvas {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 8px solid var(--white);
        transition: transform 6s cubic-bezier(0.15, 0, 0.15, 1);
        background-color: var(--white);
      }

      /* 指標 */
      .pointer {
        position: absolute;
        top: -20px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 40px;
        z-index: 30;
        filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.1));
      }
      .pointer::after {
        content: "";
        display: block;
        width: 0;
        height: 0;
        border-left: 15px solid transparent;
        border-right: 15px solid transparent;
        border-top: 30px solid var(--pink-deep);
      }

      /* 中心 START 按鈕 */
      .start-btn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 80px;
        height: 80px;
        background: radial-gradient(
          circle at 30% 30%,
          #ff8ab3,
          var(--pink-deep)
        );
        border-radius: 50%;
        border: 4px solid var(--white);
        color: var(--white);
        font-weight: bold;
        font-size: 18px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 40;
        box-shadow:
          0 6px 15px rgba(255, 105, 180, 0.4),
          inset 0 -4px 6px rgba(0, 0, 0, 0.1);
        transition: all 0.2s active;
        user-select: none;
      }

      .start-btn:active {
        transform: translate(-50%, -50%) scale(0.9);
        box-shadow: 0 2px 5px rgba(255, 105, 180, 0.4);
      }

      .start-btn.disabled {
        filter: grayscale(0.5);
        cursor: not-allowed;
        pointer-events: none;
      }

      /* 標題與裝飾 */
      .header {
        text-align: center;
        margin-bottom: 30px;
        z-index: 10;
      }

      .header h1 {
        color: var(--pink-deep);
        margin: 0;
        font-size: 28px;
        text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
      }

      .header p {
        color: var(--text-color);
        margin-top: 5px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="bg-elements" id="bgElements"></div>

    <div class="header">
      <h1>✨ 母親節特別企劃 ✨</h1>
      <p>點擊中心 START 領取你的專屬驚喜</p>
    </div>

    <div class="wheel-container">
      <div class="pointer"></div>
      <canvas id="wheel-canvas" width="600" height="600"></canvas>
      <div id="spin-btn" class="start-btn">START</div>
    </div>

    <!-- 音效 (使用 Base64 或靜音佔位，此處保留邏輯) -->
    <audio id="spinAudio" preload="auto">
      <source
        src="https://www.dropbox.com/scl/fi/qqv22denopmj1cgevvvlt/mysound_loop.mp3?rlkey=ti86j2jv29toy12lib8j4k592&st=ug8e5j5w&raw=1"
        type="audio/mpeg"
      />
    </audio>

    <script>
      const canvas = document.getElementById("wheel-canvas");
      const ctx = canvas.getContext("2d");
      const spinBtn = document.getElementById("spin-btn");
      const spinAudio = document.getElementById("spinAudio");
      const bgElements = document.getElementById("bgElements");

      const options = [
        "點數大戶",
        "✨仙女配備",
        "顏值保固",
        "剁手補貼",
        "小資確幸",
        "下集待續",
      ];

      const colors = [
        "#FFC0CB",
        "#FFFFFF",
        "#FFC0CB",
        "#FFFFFF",
        "#FFC0CB",
        "#FFFFFF",
      ];
      const targetIndex = 1; // "項鍊3條" 的索引
      let currentRotation = 0;
      let isSpinning = false;

      // 1. 初始化背景心形
      function createFloatingHearts() {
        for (let i = 0; i < 15; i++) {
          const heart = document.createElement("div");
          heart.className = "floating-heart";
          heart.innerHTML = "❤";
          heart.style.left = Math.random() * 100 + "vw";
          heart.style.fontSize = Math.random() * 20 + 10 + "px";
          heart.style.animationDelay = Math.random() * 10 + "s";
          heart.style.animationDuration = Math.random() * 5 + 7 + "s";
          bgElements.appendChild(heart);
        }
      }

      // 2. 繪製輪盤
      function drawWheel() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = canvas.width / 2;
        const sliceAngle = (2 * Math.PI) / options.length;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        options.forEach((text, i) => {
          const angle = i * sliceAngle;

          // 畫扇形
          ctx.beginPath();
          ctx.fillStyle = colors[i];
          ctx.moveTo(centerX, centerY);
          ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);
          ctx.closePath();
          ctx.fill();

          // 畫文字
          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.rotate(angle + sliceAngle / 2);
          ctx.textAlign = "right";
          ctx.fillStyle = "#FF69B4";
          ctx.font = "bold 30px 'PingFang TC'";
          // 判斷白色格子的文字顏色深淺
          if (colors[i] === "#FFFFFF") ctx.fillStyle = "#FF1493";

          ctx.fillText(text, radius - 40, 10);
          ctx.restore();
        });
      }

      // 3. 抽獎邏輯 (必中項鍊)
      function spin() {
        if (isSpinning) return;
        isSpinning = true;
        spinBtn.classList.add("disabled");

        // 播放音效
        spinAudio.currentTime = 0;
        spinAudio.play().catch(() => {
          /* 處理瀏覽器自動播放限制 */
        });

        const segmentDeg = 360 / options.length; // 60度
        const baseSpins = 10 * 360; // 旋轉 10 圈

        /* 角度計算說明：
               Canvas 0度是在 3點鐘方向。
               順時針轉動 rotate(deg)。
               指標(Pointer)在 12點鐘方向 (-90度 或 270度)。
               目標索引 targetIndex = 1 (項鍊3條)。
               該選項的角度範圍是 [60deg, 120deg]。
               
               停止公式：
               讓 270度(上方) 減去 (目標索引 * 每格角度 + 半格) 
               就能讓目標格的中心點對準上方。
            */
        const stopAngle = 270 - (targetIndex * segmentDeg + segmentDeg / 2);

        // 累加旋轉角度 (確保每次旋轉都是順時針且連續)
        currentRotation +=
          baseSpins + stopAngle + (360 - (currentRotation % 360));

        canvas.style.transform = `rotate(${currentRotation}deg)`;

        // 結束處理
        setTimeout(() => {
          isSpinning = false;
          spinBtn.classList.remove("disabled");

          // 灑花特效
          confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 },
            colors: ["#FFC0CB", "#FF69B4", "#FFFFFF"],
          });

          alert("恭喜獲得：仙女配備兌換券！");
        }, 6000);
      }

      // 初始化
      createFloatingHearts();
      drawWheel();
      spinBtn.addEventListener("click", spin);
    </script>
  </body>
</html>
